name: Build Jebba ACC Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: jebba-acc-windows-app
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Jebba-ACC-Windows-Installer
          path: jebba-acc-windows-app/release/*.exe
          if-no-files-found: error
          retention-days: 14
